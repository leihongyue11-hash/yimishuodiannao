<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DWG 转 PDF 在线工具</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;padding:24px}
    .wrap{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
    h1{margin-top:0}
    .row{margin:12px 0}
    label{display:block;margin-bottom:6px;font-weight:600}
    input,select,button{padding:10px;border:1px solid #ddd;border-radius:8px}
    button{background:#1565d8;color:#fff;cursor:pointer}
    #log{margin-top:16px;padding:12px;background:#0f172a;color:#e2e8f0;border-radius:8px;min-height:120px;white-space:pre-wrap}
    .muted{color:#666;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DWG 转 PDF 在线工具</h1>
    <p class="muted">支持单个 DWG 或 ZIP 批量（ZIP 内多个 DWG）转换。请先在服务端配置 DWG_CONVERTER_CMD。</p>

    <div class="row">
      <label>选择文件（.dwg 或 .zip）</label>
      <input id="file" type="file" accept=".dwg,.zip" />
    </div>

    <div class="row">
      <label>纸张</label>
      <select id="paper_size"><option>A4</option><option>A3</option></select>
    </div>

    <div class="row">
      <label>方向</label>
      <select id="orientation"><option value="portrait">竖向</option><option value="landscape">横向</option></select>
    </div>

    <div class="row">
      <button id="submit">开始转换</button>
    </div>

    <div id="log">等待上传...</div>
  </div>

  <script>
    const log = (msg) => document.getElementById('log').textContent = msg;

    async function pollTask(taskId){
      while(true){
        const res = await fetch(`/api/v1/tasks/${taskId}`);
        const data = await res.json();
        log(`任务ID: ${data.id}\n类型: ${data.task_type}\n状态: ${data.status}\n进度: ${data.progress}%\n详情: ${data.detail || '无'}\n错误: ${data.error_message || '无'}`);
        if(data.status === 'success'){
          log(`任务ID: ${data.id}\n状态: 转换完成\n下载: ${location.origin}${data.download_url}`);
          break;
        }
        if(data.status === 'failed') break;
        await new Promise(r => setTimeout(r, 1200));
      }
    }

    document.getElementById('submit').addEventListener('click', async () => {
      const fileInput = document.getElementById('file');
      if(!fileInput.files.length){
        log('请先选择 DWG 或 ZIP 文件');
        return;
      }
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      fd.append('paper_size', document.getElementById('paper_size').value);
      fd.append('orientation', document.getElementById('orientation').value);
      fd.append('scale', 'fit');
      fd.append('line_style', 'default');

      log('上传中...');
      const res = await fetch('/api/v1/convert', {method:'POST', body: fd});
      if(!res.ok){
        const e = await res.text();
        log('提交失败: ' + e);
        return;
      }
      const data = await res.json();
      log(`已创建任务: ${data.id}`);
      pollTask(data.id);
    });
  </script>
</body>
</html>
