        var pauseAdShown = false;
        var gameStartTime = Date.now();
        var pauseCount = 0;

        // 监听游戏暂停事件，展示暂停广�?        function setupPauseAd() {
            var pauseBtn = document.getElementById('joystick_btn_start');
            if (pauseBtn) {
                pauseBtn.addEventListener('click', function() {
                    pauseCount++;
                    // �?次暂停时展示广告（避免首次暂停就弹广告）
                    if (pauseCount >= 3 && !pauseAdShown) {
                        showPauseAd();
                    }
                });
            }

            // 也监听键盘暂�?            document.addEventListener('keydown', function(e) {
                // p�?= 暂停
                if (e.key === 'p' || e.key === 'P') {
                    pauseCount++;
                    if (pauseCount >= 3 && !pauseAdShown) {
                        showPauseAd();
                    }
                }
            });
        }

        function showPauseAd() {
            pauseAdShown = true;
            var overlay = document.getElementById('pause-ad-overlay');
            if (overlay) {
                overlay.style.display = 'flex';
                // 尝试触发Google AdSense广告填充
                try {
                    if (window.adsbygoogle) {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    }
                } catch(e) {}
            }
        }

        function hidePauseAd() {
            var overlay = document.getElementById('pause-ad-overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        document.getElementById('close-pause-ad').addEventListener('click', hidePauseAd);
        document.getElementById('resume-game-btn').addEventListener('click', hidePauseAd);

        // 游戏开�?0秒后，展示分享引�?        setTimeout(function() {
            var shareGuide = document.getElementById('share-guide');
            if (shareGuide) {
                shareGuide.style.display = 'block';
                setTimeout(function() {
                    shareGuide.style.display = 'none';
                }, 5000);
            }
        }, 30000);

        // 初始�?        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupPauseAd);
        } else {
            setupPauseAd();
        }
    })();

    // ===== 微信分享配置 =====
    var url = location.href;
    var wechatJssdkEndpoint = window.WECHAT_JSSDK_ENDPOINT || "";

    if (wechatJssdkEndpoint && window.wx) {
    $.ajax({
        type: "get",
        url: wechatJssdkEndpoint + encodeURIComponent(url),
        dataType: "jsonp",
        jsonp: "callback",
        jsonpCallback: "success_jsonpCallback",
        success: function (data) {

            wx.config({
                debug: false,
                appId: data.appId,
                timestamp: data.timestamp,
                nonceStr: data.nonceStr,
                signature: data.signature,
                jsApiList: [
                    'onMenuShareTimeline',
                    'onMenuShareAppMessage',
                    'onMenuShareQQ',
                    'onMenuShareWeibo',
                    'onMenuShareQZone',
                    'updateTimelineShareData',
                    'updateAppMessageShareData'
                ]
            });
        },
        error: function (data) {
            // 静默失败
        }
    });

    wx.ready(function () {
        var shareImageUrl = location.protocol + "//" + location.host + location.pathname.replace(/[^\/]*$/, "") + "logo1.png";
        var shareData = {
            title: '🎮 在线小霸王游戏机�?秒找回童年！',
            desc: '超级玛丽、魂斗罗、淘金者、冒险岛...80/90后经典游戏，手机电脑都能玩！',
            link: url,
            imgUrl: shareImageUrl
        };

        // 分享到朋友圈
        wx.onMenuShareTimeline(shareData);
        // 分享给好�?        wx.onMenuShareAppMessage(shareData);
        // QQ
        wx.onMenuShareQQ(shareData);
        // 微博
        wx.onMenuShareWeibo(shareData);
        // QQ空间
        wx.onMenuShareQZone(shareData);

        // 新版API兼容
        if (wx.updateTimelineShareData) {
            wx.updateTimelineShareData(shareData);
            wx.updateAppMessageShareData(shareData);
        }
    });

    wx.error(function (res) {
        // 静默失败
    });
    }
</script>
